# ----------------------------------------------------------------------
# Internal full build including private vneinteraction (uses BOT_PAT).
# Not triggered by pull_request so fork PRs never run with secrets.
# ----------------------------------------------------------------------

name: CI (internal full)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "CHANGELOG.md"
      - "VERSION"
      - ".release-please-manifest.json"
      - ".github/release-please-config.json"
  workflow_dispatch:

jobs:
  internal-full:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.BOT_PAT }}

    - name: Use HTTPS for GitHub (no SSH keys on runner)
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Init vnemath submodules (HTTPS for CI)
      run: |
        if [ -d deps/internal/vnemath/.git ]; then
          cd deps/internal/vnemath
          git config submodule.cmake/vnecmake.url https://github.com/vertexnova/vnecmake.git
          git config submodule.deps/internal/vnecommon.url https://github.com/vertexnova/vnecommon.git
          git config submodule.deps/internal/vnelogging.url https://github.com/vertexnova/vnelogging.git
          git submodule update --init --recursive
        fi

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Configure CMake (with vneinteraction)
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DVNE_TESTBED_CI=ON \
          -DVNE_WITH_VNEINTRACTION=ON

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Test
      working-directory: build
      run: ctest --output-on-failure
