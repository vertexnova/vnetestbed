# Codecov configuration for vnetestbed
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        # Allow coverage to drop by up to 5% before failing
        threshold: 5%
        # Minimum coverage required (fail status if below)
        target: 80%
    patch:
      default:
        # New code should have at least 50% coverage
        target: 50%

# Ignore files that are not part of library coverage
ignore:
  - "tests/**/*"
  - "examples/**/*"
  - "deps/external/**/*"
  - "deps/internal/**/*"
  - "cmake/**/*"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
